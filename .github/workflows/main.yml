name: Build ps2_xmb_combo.sprx

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Prebuilt ps3dev toolchain + PSL1GHT (no 30-60 min toolchain compile)
    container: zeldin/ps3dev-docker:latest

    steps:
      - uses: actions/checkout@v4

      # The image should already export PS3DEV / PSL1GHT / PATH.
      # This step prints them so a failure is easy to diagnose.
      - name: Show toolchain environment
        run: |
          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"
          which ppu-lv2-gcc || ls /usr/local/ps3dev/ppu/bin || true
          which sprxlinker make_self || true

      - name: Build plugin
        run: |
          export PS3DEV="${PS3DEV:-/usr/local/ps3dev}"
          export PSL1GHT="${PSL1GHT:-$PS3DEV}"
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2_xmb_combo
          path: build/ps2_xmb_combo.sprx

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ps2_xmb_combo.sprx
